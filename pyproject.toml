[project]
name = "wyckoff"
version = "0.1.0"
description = "威克夫量价分析工具：识别美股和加密货币日线上的威克夫阶段与事件，并给出历史统计"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2",
    "ccxt>=4.0",
    "pyarrow>=15",
    "plotly>=5.20",
    "jinja2>=3.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
wyckoff = "wyckoff.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wyckoff"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "playwright>=1.40",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
markers = [
    "network: 需要联网的数据源测试",
    "e2e: Playwright 端到端测试",
    "slow: 耗时较长的测试",
]

[tool.ruff]
line-length = 110
target-version = "py311"
